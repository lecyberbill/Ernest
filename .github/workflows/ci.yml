name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    name: Python Unit Tests & Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio requests

      - name: Validate 10 Architectural Invariants
        env:
          PYTHONPATH: .
        run: |
          python tests/validate_invariants.py

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  test-rust:
    name: Rust Compilation & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (WebKit/GTK for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check earnest-core
        run: |
          cd earnest-core
          cargo check --verbose

      - name: Check earnest-ide/core
        run: |
          cd earnest-ide/core
          cargo check --verbose

      - name: Check earnest-bcpe
        run: |
          cd earnest-bcpe
          cargo check --verbose
