[package]
name = "earnest-ide-desktop"
version = "0.1.0"
description = "Earnest IDE Desktop Application"
authors = ["DeepMind Pair • Earnest Platform"]
edition = "2021"

[lib]
name = "earnest_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
earnest-ide-core = { path = "../core" }
