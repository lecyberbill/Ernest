[package]
name = "hernest-bcpe"
version = "0.1.0"
edition = "2021"
description = "Base de connaissances d'expérience (BCPE) exposée via MCP"
license = "MIT"

[lib]
name = "kb"
path = "src/lib.rs"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
yaml_serde = "0.10"
chrono = { version = "0.4", features = ["clock"] }
schemars = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.test]
opt-level = 2
