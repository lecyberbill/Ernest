[package]
name = "hernest-ide-desktop"
version = "0.1.0"
description = "Hernest IDE Desktop Application"
authors = ["DeepMind Pair • Hernest Platform"]
edition = "2021"

[lib]
name = "hernest_ide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
hernest-ide-core = { path = "../core" }
